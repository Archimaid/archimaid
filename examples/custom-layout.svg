<svg id="archimate-example" width="428" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 508" height="508" role="graphics-document document" aria-roledescription="archimate" aria-describedby="chart-desc-archimate-example" aria-labelledby="chart-title-archimate-example"><title id="chart-title-archimate-example">Order fulfilment with pinned positions</title><desc id="chart-desc-archimate-example">A fulfilment clerk performs the fulfil order process, which the order service serves. The order management component, containing billing, realizes the order service.</desc><style>#archimate-example{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#archimate-example .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#archimate-example .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#archimate-example .error-icon{fill:#552222;}#archimate-example .error-text{fill:#552222;stroke:#552222;}#archimate-example .edge-thickness-normal{stroke-width:1px;}#archimate-example .edge-thickness-thick{stroke-width:3.5px;}#archimate-example .edge-pattern-solid{stroke-dasharray:0;}#archimate-example .edge-thickness-invisible{stroke-width:0;fill:none;}#archimate-example .edge-pattern-dashed{stroke-dasharray:3;}#archimate-example .edge-pattern-dotted{stroke-dasharray:2;}#archimate-example .marker{fill:#333333;stroke:#333333;}#archimate-example .marker.cross{stroke:#333333;}#archimate-example svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#archimate-example p{margin:0;}#archimate-example .archimate-label{font-family:var(--mermaid-font-family, Arial, sans-serif);font-size:14px;}#archimate-example .archimate-title{font-size:17px;font-weight:600;}#archimate-example .archimate-edge-label{font-size:12px;}#archimate-example .node .neo-node{stroke:#9370DB;}#archimate-example [data-look="neo"].node rect,#archimate-example [data-look="neo"].cluster rect,#archimate-example [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#archimate-example [data-look="neo"].swimlane.cluster rect{filter:none;}#archimate-example [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#archimate-example [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#archimate-example [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#archimate-example [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#archimate-example [data-look="neo"].node circle .state-start{fill:#000000;}#archimate-example [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#archimate-example [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#archimate-example :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><defs><marker id="archimate-61-72-63-68-69-6d-61-74-65-2d-65-78-61-6d-70-6c-65-filledDot" viewBox="-14 -7 16 14" markerWidth="16" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse" refX="0" refY="0"><path d="M 0 0 a 3.5 3.5 0 1 0 -7 0 a 3.5 3.5 0 1 0 7 0 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-linejoin="round"/></marker><marker id="archimate-61-72-63-68-69-6d-61-74-65-2d-65-78-61-6d-70-6c-65-filledArrow" viewBox="-14 -7 16 14" markerWidth="16" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse" refX="0" refY="0"><path d="M 0 0 -9 -4 -9 4 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-linejoin="round"/></marker><marker id="archimate-61-72-63-68-69-6d-61-74-65-2d-65-78-61-6d-70-6c-65-openArrow" viewBox="-14 -7 16 14" markerWidth="