name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
