version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types must match the oldest supported Node.js release, not the newest.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The site depends on the package in this repository, not on a published release.
      - dependency-name: archimaid
      # @astrojs/check does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
