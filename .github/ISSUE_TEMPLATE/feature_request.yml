name: Feature request
description: Propose new syntax, notation or tooling.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to model or do, and why the current syntax or tooling does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The syntax or behaviour you suggest, with an example diagram if it changes the language. Cite the ArchiMate 3.2 section where relevant.
    validations:
      required: true
